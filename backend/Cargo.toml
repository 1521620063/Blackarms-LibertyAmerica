[package]
name = "blackarms-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
rand = "0.9"
dotenvy = "0.15"
wtransport = { version = "0.7.2", default-features = false, features = ["ring"] }

[profile.release]
lto = "thin"
strip = true
